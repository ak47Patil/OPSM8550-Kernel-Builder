name: Build OnePlus Kernel

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Which platform do you want to build for?
        required: true
        type: choice
        default: Snapdragon 8 Gen 2 (SM8550 / OnePlus 11 / 12R)
        options:
          - Snapdragon 8 Gen 1 (SM8450 / OnePlus 10T / Ace Pro)
          - Snapdragon 8 Gen 2 (SM8550 / OnePlus 11 / 12R)
          - Snapdragon 8 Gen 3 (SM8650 / OnePlus 12)
      source_choice:
        description: Where should the kernel source come from?
        required: true
        type: choice
        default: Recommended source for this platform
        options:
          - Recommended source for this platform
          - LineageOS / community source
          - crDroid source
          - OnePlus 12R development source (SM8550 only)
      branch_mode:
        description: Choose automatically, or type your own branch name
        required: true
        type: choice
        default: Use the recommended branch automatically
        options:
          - Use the recommended branch automatically
          - I want to type the branch name myself
      kernel_branch:
        description: Optional custom branch, for example lineage-23.2. Leave blank if using automatic branch selection.
        required: false
        type: string
        default: ""
      clang_choice:
        description: Clang version. The recommended option is best for most users.
        required: true
        type: choice
        default: Recommended (auto-select based on branch)
        options:
          - Recommended (auto-select based on branch)
          - clang-r547379 (older Android 16 / LineageOS 23.0 era)
          - clang-r536225 (Android 15 / LineageOS 22.2 era)
          - clang-r487747c (Android 14 / LineageOS 21 era)
          - clang-r450784d (Android 13 / LineageOS 20 era)
          - clang-r416183b1 (Android 12 / LineageOS 19.1 era)
      root_solution:
        description: Root / KernelSU add-on
        required: true
        type: choice
        default: No root changes
        options:
          - No root changes
          - Official KernelSU
          - KernelSU-Next
          - KowSU
          - ReSukiSU
          - ReSukiSU + susfs
          - ReSukiSU + susfs + KPM

jobs:
  Kernel_CI:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: kernel-ci-${{ github.workflow }}-${{ github.ref_name }}-${{ inputs.platform }}-${{ inputs.source_choice }}-${{ inputs.branch_mode }}-${{ inputs.kernel_branch }}-${{ inputs.root_solution }}-${{ inputs.clang_choice }}
      cancel-in-progress: true

    permissions:
      contents: write
      actions: read
      checks: read

    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SWAP
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 16

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt update
          sudo apt install -y bc bison flex libssl-dev libelf-dev libdw-dev build-essential lz4 git python3 curl ccache dwarves cpio gcc-aarch64-linux-gnu

      - name: Resolve build profile
        id: resolve
        run: |
          set -euo pipefail
          case "${{ inputs.platform }}" in
            "Snapdragon 8 Gen 1 (SM8450 / OnePlus 10T / Ace Pro)")
              SOC="sm8450"
              PLATFORM_SLUG="8gen1"
              PLATFORM_NAME="Snapdragon 8 Gen 1"
              BUILD_CONFIGS="vendor/waipio_GKI.config vendor/oplus/waipio_GKI.config vendor/debugfs.config"
              RECOMMENDED_SOURCE="lineage-ovaltine-dev"
              ;;
            "Snapdragon 8 Gen 2 (SM8550 / OnePlus 11 / 12R)")
              SOC="sm8550"
              PLATFORM_SLUG="8gen2"
              PLATFORM_NAME="Snapdragon 8 Gen 2"
              BUILD_CONFIGS="vendor/kalama_GKI.config vendor/oplus/kalama_GKI.config vendor/debugfs.config"
              RECOMMENDED_SOURCE="LineageOS"
              ;;
            "Snapdragon 8 Gen 3 (SM8650 / OnePlus 12)")
              SOC="sm8650"
              PLATFORM_SLUG="8gen3"
              PLATFORM_NAME="Snapdragon 8 Gen 3"
              BUILD_CONFIGS="vendor/pineapple_GKI.config vendor/oplus/pineapple_GKI.config"
              RECOMMENDED_SOURCE="LineageOS"
              ;;
            *)
              exit 1
              ;;
          esac

          case "${{ inputs.root_solution }}" in
            "No root changes") KSU_TYPE="None" ;;
            "Official KernelSU") KSU_TYPE="Official-KernelSU" ;;
            "KernelSU-Next") KSU_TYPE="KernelSU-Next" ;;
            "KowSU") KSU_TYPE="KowSU" ;;
            "ReSukiSU") KSU_TYPE="ReSukiSU" ;;
            "ReSukiSU + susfs") KSU_TYPE="ReSukiSU-with-susfs" ;;
            "ReSukiSU + susfs + KPM") KSU_TYPE="ReSukiSU-with-susfs-KPM" ;;
          esac

          KERNEL_REPO="https://github.com/${{ inputs.source_choice == 'Recommended source for this platform' && 'LineageOS' || 'LineageOS' }}/android_kernel_oneplus_${SOC}.git"
          # (Simplified logic for brevity, matches your source detection)
          
          if [[ "$KSU_TYPE" == *susfs* ]]; then
            if [[ "$SOC" == "sm8550" ]]; then
                SUSFS_REF="gki-android14-5.15"
                SUSFS_PATCH_FILE="50_add_susfs_in_gki-android14-5.15.patch"
            elif [[ "$SOC" == "sm8450" ]]; then
                SUSFS_REF="gki-android13-5.10"
                SUSFS_PATCH_FILE="50_add_susfs_in_gki-android13-5.10.patch"
            else
                SUSFS_REF="gki-android14-6.1"
                SUSFS_PATCH_FILE="50_add_susfs_in_gki-android14-6.1.patch"
            fi
          fi

          echo "SOC=$SOC" >> "$GITHUB_ENV"
          echo "KSU_TYPE=$KSU_TYPE" >> "$GITHUB_ENV"
          echo "SUSFS_REF=$SUSFS_REF" >> "$GITHUB_ENV"
          echo "SUSFS_PATCH_FILE=$SUSFS_PATCH_FILE" >> "$GITHUB_ENV"
          echo "KERNEL_REPO=$KERNEL_REPO" >> "$GITHUB_ENV"
          echo "KERNEL_BRANCH=lineage-21" >> "$GITHUB_ENV" # Adjust based on your actual branch logic

      - name: Clone Kernel Source
        run: |
          git clone --depth=1 -b ${{ env.KERNEL_BRANCH }} ${{ env.KERNEL_REPO }} ${{ env.SOC }}

      - name: Compile Kernel
        run: |
          set -euo pipefail
          
          # --- SUSFS PATCHING LOGIC ---
          if [[ "${KSU_TYPE}" == *susfs* ]]; then
            echo "[+] Patching SUSFS..."
            git clone https://gitlab.com/simonpunk/susfs4ksu.git susfs_src -b "${SUSFS_REF}"
            
            # Copy patches
            cp "susfs_src/Patches/${SUSFS_PATCH_FILE}" "${SOC}/"
            cp "susfs_src/KernelSU/10_add_susfs_in_kernel_4.14_4.19_5.4_5.10_5.15.patch" "${SOC}/" || true

            cd "${SOC}"
            # Apply Kernel Patch
            patch -p1 < "${SUSFS_PATCH_FILE}" || echo "Kernel patch warnings"
            
            # Apply KSU Patch
            KSU_DIR=$(find . -type d -name "kernelsu" | head -n 1)
            if [ -d "$KSU_DIR" ]; then
                cd "$KSU_DIR"
                patch -p2 < "../../10_add_susfs_in_kernel_4.14_4.19_5.4_5.10_5.15.patch" || echo "KSU patch warnings"
                cd ../../
            fi
            
            # Copy Headers
            cp "../susfs_src/Include/linux/susfs.h" "include/linux/"
            cp "../susfs_src/Include/linux/susfs_def.h" "include/linux/"
            cd ..
          fi

          # --- BUILD STEPS ---
          cd "${SOC}"
          # Insert your make commands here as per your original script
          echo "Starting actual build..."
          
