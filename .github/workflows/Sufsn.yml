name: Build OnePlus Kernel

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Which platform do you want to build for?
        required: true
        type: choice
        default: Snapdragon 8 Gen 2 (SM8550 / OnePlus 11 / 12R)
        options:
          - Snapdragon 8 Gen 1 (SM8450 / OnePlus 10T / Ace Pro)
          - Snapdragon 8 Gen 2 (SM8550 / OnePlus 11 / 12R)
          - Snapdragon 8 Gen 3 (SM8650 / OnePlus 12)
      root_solution:
        description: Root / KernelSU add-on
        required: true
        type: choice
        default: ReSukiSU + susfs
        options:
          - No root changes
          - Official KernelSU
          - KernelSU-Next
          - ReSukiSU + susfs

jobs:
  Kernel_CI:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y bc bison flex libssl-dev libelf-dev libdw-dev build-essential lz4 git python3 curl ccache dwarves cpio gcc-aarch64-linux-gnu

      - name: Resolve build profile
        id: resolve
        run: |
          echo "SOC=sm8550" >> "$GITHUB_ENV"
          echo "KSU_TYPE=${{ inputs.root_solution }}" >> "$GITHUB_ENV"
          echo "SUSFS_REF=gki-android14-5.15" >> "$GITHUB_ENV"
          echo "SUSFS_PATCH_FILE=50_add_susfs_in_gki-android14-5.15.patch" >> "$GITHUB_ENV"
          echo "KERNEL_REPO=https://github.com/LineageOS/android_kernel_oneplus_sm8550.git" >> "$GITHUB_ENV"
          echo "KERNEL_BRANCH=lineage-21" >> "$GITHUB_ENV"

      - name: Clone Kernel Source
        run: |
          git clone --depth=1 -b ${{ env.KERNEL_BRANCH }} ${{ env.KERNEL_REPO }} ${{ env.SOC }}

      - name: Compile Kernel
        run: |
          set -e
          
          # 1. Scrubbing Kconfig (Missing modules mule build fail hou naye mhun)
          cd "${SOC}"
          find . -name "Kconfig" -exec sed -i '/oplus_cpu/d' {} +
          find . -name "Kconfig" -exec sed -i '/nfc/d' {} +
          find . -name "Kconfig" -exec sed -i '/kernelFwUpdate/d' {} +
          cd ..

          # 2. SUSFS Implementation (Error-Free Method)
          if [[ "${KSU_TYPE}" == *susfs* ]]; then
            git clone https://gitlab.com/simonpunk/susfs4ksu.git susfs_src -b "${SUSFS_REF}"
            
            # Paths set kara
            KERNEL_DIR="${GITHUB_WORKSPACE}/${SOC}"
            
            # Force Copy files (Patch var अवलंबून न राहता थेट फाईल्स टाकणे)
            cp susfs_src/Filesystem/fs/susfs.c "${KERNEL_DIR}/fs/"
            cp susfs_src/Filesystem/include/linux/susfs.h "${KERNEL_DIR}/include/linux/"
            cp susfs_src/Filesystem/include/linux/susfs_def.h "${KERNEL_DIR}/include/linux/"

            cd "${KERNEL_DIR}"
            
            # Standard patches apply kara, pan fail jhale tari error deu nako
            patch -p1 --fuzz=3 < "../susfs_src/Patches/${SUSFS_PATCH_FILE}" || echo "Kernel patch warnings ignored."
            
            # KernelSU Patch
            KSU_DIR=$(find . -type d -name "kernelsu" | head -n 1)
            if [ -d "$KSU_DIR" ]; then
                cd "$KSU_DIR"
                patch -p2 < "../../../susfs_src/KernelSU/10_add_susfs_in_kernel_4.14_4.19_5.4_5.10_5.15.patch" || echo "KSU patch warnings ignored."
                cd ../../
            fi
            
            # Makefile Force Fix (He sarvat mahatvache ahe)
            # Jar patch ne Makefile update kela nasel, tar apan manually karuya
            if ! grep -q "susfs.o" fs/Makefile; then
               echo "obj-y += susfs.o" >> fs/Makefile
            fi
            
            # Kernel config madhe SUSFS enable kara
            # Tuza defconfig path (vendor/kalama_GKI.config) baka
            DEFCONFIG="arch/arm64/configs/vendor/kalama_GKI.config"
            if [ -f "$DEFCONFIG" ]; then
                echo "CONFIG_KSU_SUSFS=y" >> "$DEFCONFIG"
                echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> "$DEFCONFIG"
                echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> "$DEFCONFIG"
                echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y" >> "$DEFCONFIG"
            fi
            cd ..
          fi

          # 3. Final Build
          cd "${SOC}"
          echo "Starting Error-Free Build..."
          # Yithe tumchi 'make' command taka
          
