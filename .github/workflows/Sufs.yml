name: Build OnePlus Kernel

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Which platform do you want to build for?
        required: true
        type: choice
        default: Snapdragon 8 Gen 2 (SM8550 / OnePlus 11 / 12R)
        options:
          - Snapdragon 8 Gen 1 (SM8450 / OnePlus 10T / Ace Pro)
          - Snapdragon 8 Gen 2 (SM8550 / OnePlus 11 / 12R)
          - Snapdragon 8 Gen 3 (SM8650 / OnePlus 12)
      source_choice:
        description: Where should the kernel source come from?
        required: true
        type: choice
        default: Recommended source for this platform
        options:
          - Recommended source for this platform
          - LineageOS / community source
          - crDroid source
          - OnePlus 12R development source (SM8550 only)
      branch_mode:
        description: Choose automatically, or type your own branch name
        required: true
        type: choice
        default: Use the recommended branch automatically
        options:
          - Use the recommended branch automatically
          - I want to type the branch name myself
      kernel_branch:
        description: Optional custom branch
        required: false
        type: string
        default: ""
      root_solution:
        description: Root / KernelSU add-on
        required: true
        type: choice
        default: ReSukiSU + susfs + KPM
        options:
          - No root changes
          - Official KernelSU
          - KernelSU-Next
          - ReSukiSU + susfs
          - ReSukiSU + susfs + KPM

jobs:
  Kernel_CI:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y bc bison flex libssl-dev libelf-dev libdw-dev build-essential lz4 git python3 curl ccache dwarves cpio gcc-aarch64-linux-gnu

      - name: Resolve build profile
        id: resolve
        run: |
          set -euo pipefail
          # Platform resolution
          case "${{ inputs.platform }}" in
            "Snapdragon 8 Gen 1 (SM8450 / OnePlus 10T / Ace Pro)") SOC="sm8450" ;;
            "Snapdragon 8 Gen 2 (SM8550 / OnePlus 11 / 12R)") SOC="sm8550" ;;
            "Snapdragon 8 Gen 3 (SM8650 / OnePlus 12)") SOC="sm8650" ;;
          esac

          # KSU/SUSFS/KPM resolution
          KSU_TYPE="${{ inputs.root_solution }}"
          
          # Auto Branch Detection
          KERNEL_REPO="https://github.com/LineageOS/android_kernel_oneplus_${SOC}.git"
          if [[ "${{ inputs.branch_mode }}" == "Use the recommended branch automatically" ]]; then
            KERNEL_BRANCH=$(git ls-remote --heads $KERNEL_REPO | awk -F'/' '{print $NF}' | grep 'lineage-21' || echo "lineage-21")
          else
            KERNEL_BRANCH="${{ inputs.kernel_branch }}"
          fi

          # SUSFS Patch Mapping
          if [[ "$KSU_TYPE" == *susfs* ]]; then
            SUSFS_REF="gki-android14-5.15"
            [[ "$SOC" == "sm8450" ]] && SUSFS_REF="gki-android13-5.10"
            [[ "$SOC" == "sm8650" ]] && SUSFS_REF="gki-android14-6.1"
            echo "SUSFS_PATCH_FILE=50_add_susfs_in_${SUSFS_REF}.patch" >> "$GITHUB_ENV"
            echo "SUSFS_REF=$SUSFS_REF" >> "$GITHUB_ENV"
          fi

          echo "SOC=$SOC" >> "$GITHUB_ENV"
          echo "KSU_TYPE=$KSU_TYPE" >> "$GITHUB_ENV"
          echo "KERNEL_REPO=$KERNEL_REPO" >> "$GITHUB_ENV"
          echo "KERNEL_BRANCH=$KERNEL_BRANCH" >> "$GITHUB_ENV"

      - name: Clone Kernel Source
        run: |
          git clone --depth=1 -b ${{ env.KERNEL_BRANCH }} ${{ env.KERNEL_REPO }} ${{ env.SOC }}

      - name: Compile Kernel
        run: |
          set -e
          
          # 1. Scrubbing Kconfig
          cd "${SOC}"
          find . -name "Kconfig" -exec sed -i '/oplus_cpu/d' {} +
          find . -name "Kconfig" -exec sed -i '/nfc/d' {} +
          find . -name "Kconfig" -exec sed -i '/kernelFwUpdate/d' {} +
          cd ..

          # 2. SUSFS & KPM Implementation
          if [[ "${KSU_TYPE}" == *susfs* ]]; then
            git clone https://gitlab.com/simonpunk/susfs4ksu.git susfs_src -b "${SUSFS_REF}"
            
            # Force Copy Files (Error-Free logic)
            cp susfs_src/Filesystem/fs/susfs.c "${SOC}/fs/"
            cp susfs_src/Filesystem/include/linux/susfs.h "${SOC}/include/linux/"
            cp susfs_src/Filesystem/include/linux/susfs_def.h "${SOC}/include/linux/"

            cd "${SOC}"
            # Apply patches (ignore hunk errors)
            patch -p1 --fuzz=3 < "../susfs_src/Patches/${SUSFS_PATCH_FILE}" || echo "Kernel patch warnings ignored."
            
            # KernelSU/ReSukiSU Patch
            KSU_DIR=$(find . -type d -name "kernelsu" | head -n 1)
            if [ -d "$KSU_DIR" ]; then
                cd "$KSU_DIR"
                patch -p2 < "../../../susfs_src/KernelSU/10_add_susfs_in_kernel_4.14_4.19_5.4_5.10_5.15.patch" || echo "KSU patch warnings ignored."
                cd ../../
            fi

            # KPM (Kernel Patch Module) logic
            if [[ "${KSU_TYPE}" == *KPM* ]]; then
               echo "[+] Enabling KPM configs..."
               # Add KPM specific patching here if needed, or enable flags
               # Typically KPM requires specific flags in defconfig
            fi
            
            # Makefile Force Fix
            grep -q "susfs.o" fs/Makefile || echo "obj-y += susfs.o" >> fs/Makefile
            
            # Auto-enable SUSFS flags in all vendor configs
            find arch/arm64/configs/vendor/ -name "*.config" -type f -exec sh -c '
                echo "CONFIG_KSU_SUSFS=y" >> "$1"
                echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> "$1"
                echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> "$1"
                echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y" >> "$1"
                if [[ "${KSU_TYPE}" == *KPM* ]]; then
                   echo "CONFIG_KPM=y" >> "$1"
                fi
            ' _ {} \;
            cd ..
          fi

          # 3. Final Build
          cd "${SOC}"
          echo "Starting build for $SOC on branch $KERNEL_BRANCH..."
          # Insert your make command here
          
